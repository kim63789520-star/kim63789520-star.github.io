<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>추천 상품 | 플로우잇고</title>
<meta property="og:title" content="고객님께 추천드리는 상품">
<meta property="og:description" content="상담사가 골라드린 상품을 확인해 보세요.">
<script src="/site/config.js"></script>
<style>
  :root {
    --navy: #13234a; --navy2: #1c2f5e; --yellow: #ffc83d; --ink: #1a1f2c; --sub: #6b7280;
    --line: #e5e7eb; --bg: #f3f4f6; --card: #fff; --brand: #b4612a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header.top { background: var(--navy); color: #fff; padding: 20px 0 22px; }
  header.top h1 { margin: 0; font-size: 21px; line-height: 1.35; }
  header.top p { margin: 6px 0 0; color: #c7d0e6; font-size: 14px; line-height: 1.5; white-space: pre-line; }
  .panel { background: var(--card); border-radius: 16px; padding: 16px; margin: 16px 0; }
  .search { display: flex; align-items: center; gap: 8px; border: 2px solid var(--yellow); border-radius: 14px; padding: 10px 12px; background: #fff; }
  .search input { border: 0; outline: 0; flex: 1; min-width: 0; font-size: 17px; }
  .search .x { border: 0; background: none; color: var(--sub); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
  .field { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 15px; margin-top: 8px; }
  label.lb { display: block; font-size: 13px; color: var(--sub); margin-top: 12px; }
  .count { font-size: 15px; font-weight: 700; margin: 4px 2px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .count button { font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .item { background: var(--card); border-radius: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; border: 2px solid transparent; }
  .item.sel { border-color: var(--yellow); }
  .item .img { aspect-ratio: 1 / 1; background: #f5f5f3; display: flex; align-items: center; justify-content: center; }
  .item .img img { width: 82%; height: 82%; object-fit: contain; }
  .item .info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .item .meta { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
  .item .meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); display: inline-block; }
  .item .name { font-size: 14px; font-weight: 700; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; }
  .item .model { font-size: 12px; color: #9ca3af; }
  .item .price { margin-top: auto; padding-top: 6px; font-size: 13px; color: var(--sub); }
  .item .price b { font-size: 19px; color: var(--ink); }
  .item .term { font-size: 12px; color: #9ca3af; }
  .check { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.95); border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 700; color: transparent; }
  .item.sel .check { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
  .more { display: block; width: 100%; margin: 14px 0; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 15px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; line-height: 1.6; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--navy); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  .bar .wrap { display: flex; gap: 8px; align-items: center; }
  .bar .info { color: #fff; font-size: 14px; flex: 1; min-width: 0; }
  .bar .info b { color: var(--yellow); }
  .btn { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .btn.y { background: var(--yellow); color: var(--navy); }
  .btn.w { background: #fff; color: var(--navy); }
  .btn.g { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  .btn:disabled { opacity: .45; cursor: default; }
  .linkbox { margin-top: 10px; font-size: 13px; color: var(--sub); word-break: break-all; background: var(--bg); border-radius: 10px; padding: 10px; display: none; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 18px 2px 0; }
  body.view .check, body.edit-only-hide { display: none; }
  .pad { height: 90px; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="title">고객 추천 목록 만들기</h1><p id="subtitle">검색하고 보낼 상품을 고르면 고객에게 보낼 링크가 만들어집니다.</p></div></header>

<main class="wrap">
  <section class="panel" id="editor" hidden>
    <div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="예: 냉장고, 비스포크, RM70" autocomplete="off"><button class="x" id="qClear" aria-label="지우기">✕</button></div>
    <div class="row" id="typeChips">
      <button class="chip on" data-t="">전체</button>
      <button class="chip" data-t="F">상조가전</button>
      <button class="chip" data-t="R">렌탈</button>
    </div>
    <div class="row" id="sortChips">
      <button class="chip on" data-s="">추천순</button>
      <button class="chip" data-s="asc">낮은가격순</button>
      <button class="chip" data-s="desc">높은가격순</button>
    </div>
    <label class="lb" for="ttl">고객에게 보일 제목</label>
    <input class="field" id="ttl" placeholder="예: 고객님께 추천드리는 냉장고">
    <label class="lb" for="memo">안내 문구 (선택)</label>
    <input class="field" id="memo" placeholder="예: 상담사 김OO · 문의는 아래 카카오톡으로 주세요">
    <div class="linkbox" id="linkbox"></div>
  </section>

  <div class="count" id="countRow"><span id="count"></span><span id="countBtns"></span></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>더 보기</button>
  <p class="note" id="note" hidden>표시된 금액은 월 납입금 기준이며, 상세 조건은 상품을 눌러 확인하거나 상담으로 안내받으실 수 있습니다.</p>
  <div class="pad"></div>
</main>

<div class="bar" id="bar"><div class="wrap" id="barInner"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var C = window.FLOW_CONFIG || {};
  var PAGE = 40;
  var q = new URLSearchParams(location.search);
  var VIEW = q.has('ids') || q.has('q');
  var $ = function (id) { return document.getElementById(id); };
  var items = [], byId = {}, shown = PAGE, results = [];
  var state = { q: '', t: '', s: '' };
  var picked = [];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return Number(n || 0).toLocaleString('ko-KR'); }
  function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('on'); }, 1800); }
  function isSangjo(x) { return x.t === 'F'; }

  function match(list, query, type, sort) {
    var toks = String(query || '').trim().split(/\s+/).filter(Boolean).map(norm);
    var out = list.filter(function (x) {
      if (type === 'F' && !isSangjo(x)) return false;
      if (type === 'R' && isSangjo(x)) return false;
      if (!toks.length) return true;
      var hay = norm(x.n + ' ' + x.m + ' ' + (x.s || ''));
      return toks.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    if (sort === 'asc') out.sort(function (a, b) { return a.p - b.p; });
    if (sort === 'desc') out.sort(function (a, b) { return b.p - a.p; });
    return out;
  }

  function card(x, selectable) {
    var sel = picked.indexOf(x.i) >= 0;
    var meta = isSangjo(x) ? (x.s || '상조가전') + (x.e ? ' · ' + x.e + '회' : '') : '렌탈';
    var href = '/m/model/view.html?model_idx=' + x.i;
    return '<div class="item' + (sel ? ' sel' : '') + '" data-i="' + x.i + '">' +
      (selectable ? '<span class="check">✓</span>' : '') +
      '<a class="img" href="' + href + '"' + (selectable ? ' data-pick' : '') + '>' + (x.img ? '<img loading="lazy" src="' + esc(x.img) + '" alt="">' : '') + '</a>' +
      '<a class="info" href="' + href + '"' + (selectable ? ' data-pick' : '') + '>' +
        '<span class="meta"><i></i>' + esc(meta) + '</span>' +
        '<span class="name">' + esc(x.n) + '</span>' +
        '<span class="model">' + esc(x.m) + '</span>' +
        '<span class="price">월 <b>' + won(x.p) + '</b>원</span>' +
        (x.e ? '<span class="term">만기 ' + x.e + '회</span>' : '') +
      '</a></div>';
  }

  function renderGrid(list, selectable) {
    $('grid').innerHTML = list.slice(0, shown).map(function (x) { return card(x, selectable); }).join('');
    $('more').hidden = list.length <= shown;
    if (!list.length) $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">' + (VIEW ? '표시할 상품이 없습니다.<br>상담사에게 문의해 주세요.' : '검색 결과가 없습니다.') + '</div>';
  }

  // ---------------------------------------------------------------- 상담사: 고르기
  function shareUrl(mode) {
    var u = new URL('/pick/', location.origin);
    if (mode === 'all') {
      u.searchParams.set('q', state.q.trim());
      if (state.t) u.searchParams.set('type', state.t);
      if (state.s) u.searchParams.set('sort', state.s);
    } else {
      u.searchParams.set('ids', picked.join(','));
    }
    var t = $('ttl').value.trim(), m = $('memo').value.trim();
    if (t) u.searchParams.set('t', t);
    if (m) u.searchParams.set('memo', m);
    return u.toString();
  }

  function send(mode) {
    if (mode === 'pick' && !picked.length) { toast('보낼 상품을 먼저 골라 주세요'); return; }
    if (mode === 'all' && !state.q.trim()) { toast('검색어를 먼저 입력해 주세요'); return; }
    var url = shareUrl(mode);
    var lb = $('linkbox'); lb.style.display = 'block'; lb.textContent = url;
    var title = $('ttl').value.trim() || '고객님께 추천드리는 상품';
    if (navigator.share) {
      navigator.share({ title: title, text: title, url: url }).catch(function () {});
    } else {
      copy(url);
    }
  }

  function copy(text) {
    var done = function () { toast('링크를 복사했어요. 카톡에 붙여넣어 보내세요'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
  }

  function refreshEditor(resetPage) {
    if (resetPage) shown = PAGE;
    results = match(items, state.q, state.t, state.s);
    $('count').textContent = (state.q.trim() ? '“' + state.q.trim() + '” ' : '전체 ') + results.length + '개';
    $('countBtns').innerHTML = results.length ? '<button class="chip" id="pickAll">보이는 것 모두 선택</button>' : '';
    renderGrid(results, true);
    refreshBar();
  }

  function refreshBar() {
    $('barInner').innerHTML =
      '<div class="info">선택 <b>' + picked.length + '</b>개' + (picked.length ? ' · <a href="#" id="clearPick" style="text-decoration:underline">비우기</a>' : '') + '</div>' +
      '<button class="btn g" id="sendAll"' + (state.q.trim() ? '' : ' disabled') + '>검색결과 전체</button>' +
      '<button class="btn y" id="sendPick"' + (picked.length ? '' : ' disabled') + '>선택한 것 보내기</button>';
  }

  function initEditor() {
    document.body.classList.add('edit');
    $('editor').hidden = false;
    try { picked = JSON.parse(sessionStorage.getItem('pick_ids') || '[]').filter(function (i) { return byId[i]; }); } catch (e) { picked = []; }
    var save = function () { try { sessionStorage.setItem('pick_ids', JSON.stringify(picked)); } catch (e) {} };

    var h;
    $('q').addEventListener('input', function () {
      clearTimeout(h); h = setTimeout(function () {
        state.q = $('q').value;
        if (!$('ttl').dataset.touched) $('ttl').value = state.q.trim() ? '고객님께 추천드리는 ' + state.q.trim() : '';
        refreshEditor(true);
      }, 150);
    });
    $('qClear').onclick = function () { $('q').value = ''; state.q = ''; refreshEditor(true); $('q').focus(); };
    $('ttl').addEventListener('input', function () { $('ttl').dataset.touched = '1'; });
    [['typeChips', 't'], ['sortChips', 's']].forEach(function (p) {
      $(p[0]).addEventListener('click', function (e) {
        var b = e.target.closest('.chip'); if (!b) return;
        [].forEach.call($(p[0]).children, function (c) { c.classList.toggle('on', c === b); });
        state[p[1]] = b.dataset[p[1]]; refreshEditor(true);
      });
    });
    $('grid').addEventListener('click', function (e) {
      var it = e.target.closest('.item'); if (!it) return;
      e.preventDefault();
      var i = +it.dataset.i, k = picked.indexOf(i);
      if (k >= 0) picked.splice(k, 1); else picked.push(i);
      it.classList.toggle('sel', k < 0); save(); refreshBar();
    });
    $('countBtns').addEventListener('click', function (e) {
      if (e.target.id !== 'pickAll') return;
      results.slice(0, shown).forEach(function (x) { if (picked.indexOf(x.i) < 0) picked.push(x.i); });
      save(); refreshEditor(false);
    });
    $('bar').addEventListener('click', function (e) {
      if (e.target.id === 'clearPick') { e.preventDefault(); picked = []; save(); refreshEditor(false); }
      if (e.target.id === 'sendPick') send('pick');
      if (e.target.id === 'sendAll') send('all');
    });
    $('more').onclick = function () { shown += PAGE; renderGrid(results, true); };

    var init = q.get('ss_tx') || '';
    if (init) { $('q').value = init; state.q = init; $('ttl').value = '고객님께 추천드리는 ' + init; }
    var t0 = q.get('type') || '';
    if (t0 === 'F' || t0 === 'R') {
      state.t = t0;
      [].forEach.call($('typeChips').children, function (c) { c.classList.toggle('on', c.dataset.t === t0); });
    }
    refreshEditor(true);
  }

  // ---------------------------------------------------------------- 고객: 보기
  function initView() {
    document.body.classList.add('view');
    var list;
    if (q.has('ids')) {
      list = q.get('ids').split(',').map(function (s) { return byId[+s]; }).filter(Boolean);
    } else {
      list = match(items, q.get('q'), q.get('type') || '', q.get('sort') || '');
    }
    var title = q.get('t') || (q.get('q') ? '고객님께 추천드리는 ' + q.get('q') : '고객님께 추천드리는 상품');
    document.title = title + ' | ' + (C.SITE_NAME || '플로우잇고');
    $('title').textContent = title;
    $('subtitle').textContent = (q.get('memo') ? q.get('memo') + '\n' : '') + '상품을 누르면 자세한 정보를 볼 수 있어요.';
    $('count').textContent = '추천 상품 ' + list.length + '개';
    $('note').hidden = false;
    shown = Math.max(PAGE, list.length > 60 ? PAGE : list.length);
    results = list;
    renderGrid(list, false);
    $('more').onclick = function () { shown += PAGE; renderGrid(results, false); };

    var kakao = C.KAKAO_URL, phone = C.PHONE;
    $('barInner').innerHTML =
      '<div class="info">궁금한 점은 편하게 물어보세요</div>' +
      (phone ? '<a class="btn w" href="tel:' + esc(phone.replace(/[^0-9+]/g, '')) + '">전화 상담</a>' : '') +
      (kakao ? '<a class="btn y" href="' + esc(kakao) + '">카카오톡 상담</a>' : '');
  }

  fetch('/data/pick_index.json').then(function (r) { return r.json(); }).then(function (d) {
    items = d; d.forEach(function (x) { byId[x.i] = x; });
    if (VIEW) initView(); else initEditor();
  }).catch(function () {
    $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">상품 정보를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
  });
})();
</script>
</body>
</html>
