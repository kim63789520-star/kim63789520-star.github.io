        $("#up").click(function() {
            if (Flag == 1) {
                alert("목록의 처음입니다.");

                Flag--;
                $(".c" + Flag).css("display", "block");
                $(".c" + (Flag + 1)).css("display", "none");
            }
            $("#stv_pg").html("<strong class=\"recent_txt\">" + Flag + "</strong>/" + EOFlag); // 페이지 값 재설정
        });
        $("#down").click(function() {

                Flag++;
                $(".c" + Flag).css("display", "block");
                $(".c" + (Flag - 1)).css("display", "none");
            }
            $("#stv_pg").html("<strong class=\"recent_txt\">" + Flag + "</strong>/" + EOFlag); // 페이지 값 재설정

    // 2번째 이상의 옵션 처리.
    function optionAddFunc(obj, optIdx) {

        var dataTarget = $(obj).attr("data-target");
        var dataValue = $(obj).attr("data-value");
        var value = $(obj).val() ? $(obj).val() : $(obj).attr("value");
        var targetValue = $(dataTarget + "select[name*='optionSelector_']").attr("data-value");

        // 옵션계층별 데이터 처리
        if (optIdx == 0) {
            window["data_" + optIdx] = globalData[value];
            //첫번째 옵션일 경우 하위 옵션 초기화
            $("select[name*='optionSelector_']:not(:eq(0))").children().not(":first-child").remove();
            $('.itemBriefOption').text(value)
        } else {
            var parentIdx = optIdx - 1;
            window["data_" + optIdx] = window["data_" + parentIdx][value];
        }

        if (typeof value === 'undefined') {
            // 모든옵션 재설정시 금액 초기화
            $("#sit_tot_price").html(0);
            $("#sale_tot_price").html(0);
            $("input[name='io_price']").val(0);

            var listType2 = "<option value=\"\">" + targetValue + " 선택</option>";

            $.each(data, function (idx, val) {
                listType2 += " <option value=\"" + idx + "\">" + idx + "</option>";
            });

            // 옵션정보 출력
            $(dataTarget + "select[name*='optionSelector_']").html(listType2);

            // selectric
            $('.selectric_wrap select').selectric();
            $('#option_set_list #option_set_added').empty();
            return false;
        }

        // data 변수에 객체저장
        var data = window["data_" + optIdx];

        // 모든옵션 재설정시 금액 초기화
        $("#sit_tot_price").html(0);
        $("#sale_tot_price").html(0);
        $("input[name='io_price']").val(0);

        // 마지막 옵션여부 확인 및 금액 처리.
        if (typeof data != "object") {

            const sale_point = $("input[name='alPrice']").val();
            const sale_tot_price = commaStr(data - sale_point) < "0" ? "0" : commaStr(data - sale_point);

            $("#sale_tot_price").html(commaStr(sale_tot_price));

                $('#option_set_list #option_set_added').empty();
                sel_option_process(true);
            } else {
                var id = "";
                var value, info, sel_opt, item, price, stock, amt, link, run_error = false;
                var option = sep = "";
                info = $("select.it_option:last").val().split(",");

                $("select.it_option").each(function (index) {
                    value = $(this).val();
                    item = $(this).closest(".vi_txt_li dl").find("dt label").text();

                    if (!value) {
                        run_error = true;
                        return false;
                    }

                    // 옵션선택정보
                    sel_opt = value.split(",")[0];

                    if (id == "") {
                        id = sel_opt;
                    } else {
                        id += chr(30) + sel_opt;
                        sep = " / ";
                    }

                    option += sep + item + ":" + sel_opt;
                });

                if (run_error) {
                    alert(item + "을(를) 선택해 주십시오.");

                price = data;

                add_sel_option(0, id, option, price, stock, amt, link);

        $.each(data, function (idx, val) {
            listType2 += "<option value=\"" + idx + "\">" + idx + "</option>";

        $(dataTarget + "select[name*='optionSelector_']").html(listType2);

        $('.selectric_wrap select').selectric();
